<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>网格布局</title>
    <style>
        #container {
            width: 100vh;
            height: 80vh;
            background: bisque;
            display: grid;
            grid-template-rows: repeat(3,100px);
            grid-template-columns: repeat(3,100px);
            grid-template-areas: "a a a" "b b d" "c c c";
            /*justify-items: left;*/
            grid-gap: 10px 100px;
        }
        /*#container > div{*/
        /*    width: 100px;*/
        /*    height: 100px;*/
        /*}*/
        /*#item1{*/
        /*    grid-column-start: 1;*/
        /*    grid-column-end: 4;*/
        /*}*/
        #item1{
            grid-area: a;
        }
        #item2{
            grid-area: b;
        }
    </style>
</head>
<body>
<div id="container">
    <div id="item1">item1</div>
    <div id="item2">item2</div>
    <div id="item3">item3</div>
    <div id="item4">item4</div>
    <div id="item5">item5</div>
    <div id="item6">item6</div>
    <!-- <div id="item7">item7</div> -->
    <!-- <div id="item8">item8</div> -->
    <!-- <div id="item9">item9</div> -->
</div>

<script>
    let itemList = document.querySelectorAll('#container > div');
    let colors = ['lightgoldenrodyellow',
    'lightpink',
    'lavender',
    'lightsalmon',
    'tomato',
    'cadetblue',
    'darkseagreen',
    'gold',
    'lightcoral']
    for (var i = 0; i<itemList.length;i++){
        itemList[i].style.background = colors[i];
    }
</script>
</body>
</html>
