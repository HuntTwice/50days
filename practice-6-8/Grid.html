<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>网格布局</title>
    <style>
        #container {
            width: 600px;
            height: 600px;
            background: black;
            display: grid;
            grid-template-rows: repeat(6,1fr);
            grid-template-columns: repeat(6,1fr);
        }
        #item1{
            grid-column-start: 1;
            grid-column-end: -2;
        }
        #item2{
            grid-row-start: 2;
            grid-row-end: span 4;
        }
        #item3{
            grid-row: 3/4;
            grid-column: -2/-1;
        }
        #item4{
            grid-area: 4/4/5/-2;
        }
        .parent{
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
<div class="parent">
    <div id="container">
        <div id="item1">item1</div>
        <div id="item2">item2</div>
        <div id="item3">item3</div>
        <div id="item4">item4</div>
        <div id="item5">item5</div>
        <div id="item6">item6</div>

    </div>
</div>

<script>
    let itemList = document.querySelectorAll('#container > div');
    let colors = ['lightgoldenrodyellow',
    'lightpink',
    'lavender',
    'lightsalmon',
    'tomato',
    'cadetblue',
    'darkseagreen',
    'gold',
    'lightcoral']
    for (var i = 0; i<itemList.length;i++){
        itemList[i].style.background = colors[i];
    }
</script>
</body>
</html>
